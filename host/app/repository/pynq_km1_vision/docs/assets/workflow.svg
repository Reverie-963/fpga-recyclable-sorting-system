<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1390" viewBox="0 0 1200 1390"><title>轻质回收物动态分拣流程图</title><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#38536f"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="600" y="42" text-anchor="middle" font-size="30" font-weight="bold" fill="#20354c">连续输送中的预测抓取流程</text><rect x="330" y="85" width="520" height="89" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="590.0" y="116" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">自检与机械臂观察准备位</text><text x="590.0" y="145" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">模型 / PL编码器 / 标定 / 时间参数</text><rect x="330" y="220" width="520" height="112" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="590.0" y="251" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">最新图像与位移快照</text><text x="590.0" y="280" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">PL前景掩码 / PS几何更新</text><text x="590.0" y="305" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">后台YOLO检测并绑定原帧目标编号</text><rect x="330" y="379" width="520" height="89" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="590.0" y="410" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">目标关联与接触位置预测</text><text x="590.0" y="439" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">带位移补偿 / 类别时效 / 误差上界</text><polygon points="590,502.5 850.0,560 590,617.5 330.0,560" fill="#fff5d9" stroke="#b58a36" stroke-width="2"/><text x="590" y="567.0" text-anchor="middle" font-size="19" font-weight="normal" fill="#20354c">存在窗口内可行拦截？</text><rect x="30" y="501" width="225" height="121" rx="12" fill="#f1f4f7" stroke="#6e94ba" stroke-width="2"/><text x="142.5" y="532" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">继续观察或放行</text><text x="142.5" y="561" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">无目标 / 歧义 / 窗口错失</text><text x="142.5" y="586" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">流出物进入末端收集区</text><polyline points="330,560 255,560" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><text x="286" y="545" text-anchor="middle" font-size="17" font-weight="normal" fill="#20354c">否</text><polyline points="141,501 141,276 330,276" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><rect x="330" y="659" width="520" height="90" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="590.0" y="690" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">预检轨迹并提交拦截计划</text><text x="590.0" y="719" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">移向目标上方时持续更新几何</text><rect x="330" y="801" width="520" height="91" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="590.0" y="832" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">下降前复查 / 闭爪前检查</text><text x="590.0" y="861" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">目标预测位置 / 编码器漂移 / 时限</text><rect x="330" y="942" width="520" height="89" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="590.0" y="973" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">抓取、分类放置并返回</text><text x="590.0" y="1002" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">闭爪及放置期间不保证视觉跟踪</text><polygon points="590,1063.0 850.0,1120 590,1177.0 330.0,1120" fill="#fff5d9" stroke="#b58a36" stroke-width="2"/><text x="590" y="1127.0" text-anchor="middle" font-size="19" font-weight="normal" fill="#20354c">分类盒图像证据通过？</text><rect x="30" y="1063" width="225" height="114" rx="12" fill="#eaf7f1" stroke="#6e94ba" stroke-width="2"/><text x="142.5" y="1094" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">记录并继续下一目标</text><text x="142.5" y="1123" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">重新采图与建立编号</text><text x="142.5" y="1148" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">任务或观察上限后结束</text><polyline points="330,1120 255,1120" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><text x="286" y="1103" text-anchor="middle" font-size="17" font-weight="normal" fill="#20354c">是</text><polyline points="30,1120 14,1120 14,195 305,195 305,240 330,240" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="904" y="695" width="270" height="151" rx="12" fill="#fff1e8" stroke="#6e94ba" stroke-width="2"/><text x="1039.0" y="726" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">停止后续指令并记录</text><text x="1039.0" y="755" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">目标丢失 / 位移异常</text><text x="1039.0" y="780" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">超差 / 迟到 / 通信错误</text><text x="1039.0" y="805" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">证据不足 → 人工复核</text><polyline points="850,276 1036,276 1036,695" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="1040" y="413" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">异常</text><polyline points="850,846 904,788" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><polyline points="850,1120 1050,1120 1050,846" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><text x="881" y="1104" text-anchor="middle" font-size="17" font-weight="normal" fill="#20354c">否</text><polyline points="590,174 590,220" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><polyline points="590,332 590,379" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><polyline points="590,468 590,503" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><polyline points="590,617 590,659" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><polyline points="590,749 590,801" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><polyline points="590,892 590,942" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><polyline points="590,1031 590,1063" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><text x="618" y="641" text-anchor="middle" font-size="17" font-weight="normal" fill="#20354c">是</text><text x="600" y="1263" text-anchor="middle" font-size="20" font-weight="normal" fill="#20354c">漏抓物也会随带离开：不能把原位置清空当作成功证据。</text><text x="600" y="1301" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">真实回收率按全部入场物体与外部录像统计，包含忙碌期间流出的物体。</text><text x="600" y="1339" text-anchor="middle" font-size="17" font-weight="normal" fill="#627589">输送带独立调速；软件停止不能撤销已发送运动，现场保留独立断电措施。</text></g></svg>