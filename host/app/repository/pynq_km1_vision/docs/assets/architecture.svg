<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110"><title>轻质回收物动态分拣总设计框图</title><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#38536f"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="600" y="40" text-anchor="middle" font-size="30" font-weight="bold" fill="#20354c">轻质回收物动态视觉分拣</text><text x="600" y="76" text-anchor="middle" font-size="20" font-weight="normal" fill="#20354c">连续输送 / 类别识别 / 位移补偿 / 窗口内预测拦截</text><rect x="65" y="110" width="430" height="96" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="280.0" y="141" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">固定相机与PYNQ PS采集</text><text x="280.0" y="170" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">带面整帧图像 / 读帧时间</text><text x="280.0" y="195" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">采集时延修正与误差预算</text><rect x="705" y="110" width="430" height="96" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="920.0" y="141" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">输送带与正交编码器</text><text x="920.0" y="170" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">轻质回收物单层有间距流入</text><text x="920.0" y="195" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">实际带位移 / A、B两相信号</text><rect x="65" y="270" width="430" height="124" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="280.0" y="301" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">PYNQ PL 图像核</text><text x="280.0" y="330" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">阈值分割 + 3×3开运算</text><text x="280.0" y="355" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">AXI DMA → 二值前景掩码</text><text x="280.0" y="380" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">PS提取轮廓与内部候选点</text><rect x="705" y="270" width="430" height="124" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="920.0" y="301" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">PYNQ PL 编码器核</text><text x="920.0" y="330" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">正交计数 + 非法跃迁统计</text><text x="920.0" y="355" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">100MHz时间计数 / 原子快照</text><text x="920.0" y="380" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">AXI GPIO → PS位移与速度</text><polyline points="280,206 280,270" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><polyline points="920,206 920,270" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><rect x="65" y="468" width="430" height="126" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="280.0" y="499" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">AMD Ryzen AI PC</text><text x="280.0" y="528" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">YOLO11n / PyTorch ROCm</text><text x="280.0" y="553" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">异步检测 → 类别、框、分数</text><text x="280.0" y="578" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">返回帧编号与模型标识</text><polyline points="65,158 24,158 24,531 65,531" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><text x="126" y="441" text-anchor="middle" font-size="17" font-weight="normal" fill="#20354c">整帧图像 / 以太网HTTP</text><rect x="705" y="468" width="430" height="126" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="920.0" y="499" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">PYNQ PS 跟踪与预测</text><text x="920.0" y="528" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">编码器补偿的一对一目标关联</text><text x="920.0" y="553" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">延迟类别只绑定原始目标编号</text><text x="920.0" y="578" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">按带速、误差和接触时刻预测</text><polyline points="495,326 577,326 577,495 705,495" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><text x="593" y="310" text-anchor="middle" font-size="17" font-weight="normal" fill="#20354c">前景几何</text><polyline points="920,394 920,468" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><text x="1014" y="439" text-anchor="middle" font-size="17" font-weight="normal" fill="#20354c">位移 / 时间</text><polyline points="495,554 705,554" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><text x="595" y="543" text-anchor="middle" font-size="17" font-weight="normal" fill="#20354c">语义结果</text><rect x="360" y="677" width="640" height="112" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="680.0" y="708" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">PYNQ PS 抓取窗口与动作调度</text><text x="680.0" y="737" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">可达区 + 有效期 + 误差预算 + 动作时限</text><text x="680.0" y="762" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">下降前复查目标；闭爪前检查编码器漂移</text><polyline points="920,594 920,641 680,641 680,677" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><rect x="360" y="853" width="640" height="112" rx="12" fill="#edf5ff" stroke="#6e94ba" stroke-width="2"/><text x="680.0" y="884" text-anchor="middle" font-size="22" font-weight="bold" fill="#20354c">KM1机械臂与分类盒</text><text x="680.0" y="913" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">USB串口115200 → 运动中拦截 → 分类放置</text><text x="680.0" y="938" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">塑料回收 / 木质再利用；盒区图像复核</text><polyline points="680,789 680,853" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)"/><polyline points="360,910 52,910 52,206 190,206" fill="none" stroke="#38536f" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="185" y="721" text-anchor="middle" font-size="18" font-weight="normal" fill="#20354c">相机重新观察分类盒</text><text x="185" y="753" text-anchor="middle" font-size="17" font-weight="normal" fill="#20354c">物体离开原位不等于成功</text><text x="600" y="1016" text-anchor="middle" font-size="20" font-weight="normal" fill="#20354c">忙碌或错过窗口的物体进入末端收集区；异常停止后续指令并记录。</text><text x="600" y="1052" text-anchor="middle" font-size="18" font-weight="normal" fill="#627589">UVC时延与机械接触时间须实测；当前不是曝光硬同步或硬件急停系统。</text><text x="600" y="1083" text-anchor="middle" font-size="17" font-weight="normal" fill="#627589">编码器RTL与图像HLS均提供源码；板级综合、时序及动态成功率按实机验收。</text></g></svg>